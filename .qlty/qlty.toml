config_version = "0"

exclude_patterns = [
  "*_min.*",
  "*-min.*",
  "*.min.*",
  "**/.yarn/**",
  "**/*.d.ts",
  "**/assets/**",
  "**/bower_components/**",
  "**/build/**",
  "**/cache/**",
  "**/config/**",
  "**/db/**",
  "**/deps/**",
  "**/dist/**",
  "**/extern/**",
  "**/external/**",
  "**/generated/**",
  "**/Godeps/**",
  "**/gradlew/**",
  "**/mvnw/**",
  "**/node_modules/**",
  "**/protos/**",
  "**/seed/**",
  "**/target/**",
  "**/templates/**",
  "**/testdata/**",
  "**/vendor/**",
  # Alembic migrations are mandated boilerplate (docstring/header,
  # revision/down_revision, upgrade()/downgrade() shape) and must stand
  # alone as immutable historical scripts — there's no legitimate way to
  # de-duplicate two migrations that happen to add a similar shape of
  # nullable columns without breaking that model. Confirmed a genuine
  # false positive with the user (2026-09) before adding this exclusion,
  # per this repo's own rule against loosening checks unilaterally.
  "migrations/versions/**",
]

test_patterns = [
  "**/test/**",
  "**/spec/**",
  "**/*.test.*",
  "**/*.spec.*",
  "**/*_test.*",
  "**/*_spec.*",
  "**/test_*.*",
  "**/spec_*.*",
]

[smells]
mode = "comment"

[[source]]
name = "default"
default = true


[[plugin]]
name = "bandit"
mode = "disabled"

[[plugin]]
name = "hadolint"
mode = "disabled"

[[plugin]]
name = "radarlint-iac"
mode = "disabled"

[[plugin]]
name = "radarlint-python"
mode = "disabled"

[[plugin]]
name = "ripgrep"
mode = "disabled"

[[plugin]]
name = "ruff"
drivers = [
  "lint",
]
mode = "disabled"

# Deliberately left ENABLED, unlike ley-shards-bot's template — see
# CLAUDE.md's Tooling section and the repo-wide "no secrets ever get
# pushed" rule. This gives every commit (locally via pre-commit, and in
# CI) an automated secret scan on top of ruff/ty/complexity checks. Run
# via `qlty check --filter trufflehog` (not `qlty smells`, which never
# invokes plugins regardless of this config — see .pre-commit-config.yaml).
[[plugin]]
name = "trufflehog"
