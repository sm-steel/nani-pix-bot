name: Tests

# No paths filter: both are required checks on master, and a required
# check whose workflow never starts leaves the PR waiting forever. It also
# keeps the shipped release notes (src/**/release_notes/*.md) under test.
on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.11"

      - name: Install project dependencies
        run: uv sync

      # ffmpeg is pinned in mise.toml (BtbN's static 7.1.1 build) and its
      # sha256 in mise.lock, the same binary local dev and the Docker image
      # use; mise.toml's locked mode fails the install on any mismatch. The
      # reveal video tests (marked `ffmpeg`) skip without it (issue #295).
      - name: Install pinned tools (ffmpeg)
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          version: 2026.10.4

      # Prove which ffmpeg the tests run against, rather than trusting PATH.
      - name: Check the ffmpeg version
        run: |
          version="$(ffmpeg -version | head -1)"
          echo "$version"
          case "$version" in
            *n7.1.1-57-g1b48158a23*) ;;
            *) echo "::error::expected the pinned ffmpeg n7.1.1-57-g1b48158a23"; exit 1 ;;
          esac

      # No service containers needed — every test fixture uses an
      # in-memory SQLite engine (create_engine("sqlite:///:memory:")),
      # never the real MariaDB the bot runs against in production.
      - name: Run tests
        run: uv run pytest -q
