name: Tests

on:
  push:
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**"]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Install project dependencies
        run: uv sync

      # ffmpeg is pinned in mise.toml, the same build local dev and the
      # Docker image use; the reveal video tests (marked `ffmpeg`) skip
      # without it (issue #295).
      - name: Install pinned tools (ffmpeg)
        uses: jdx/mise-action@v5.1.1
        with:
          version: 2026.10.4

      # No service containers needed — every test fixture uses an
      # in-memory SQLite engine (create_engine("sqlite:///:memory:")),
      # never the real MariaDB the bot runs against in production.
      - name: Run tests
        run: uv run pytest -q
