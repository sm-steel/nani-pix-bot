name: Checks

# No paths filter: both are required checks on master, and a required
# check whose workflow never starts leaves the PR waiting forever. It also
# keeps the shipped release notes (src/**/release_notes/*.md) under test.
on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # uv and qlty at the versions mise.toml pins and mise.lock checksums
      # (locked mode fails on any mismatch), the same binaries as local dev.
      # Only these two: ffmpeg and Node aren't needed for the hooks.
      - name: Install pinned tools (uv, qlty)
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          version: 2026.10.4
          install_args: uv github:qltysh/qlty

      - name: Install project dependencies
        run: uv sync

      # Just the CLI binary — no Qlty Cloud account involved. Complexity/
      # duplication analysis (`qlty smells`) plus the trufflehog secret
      # scan (`qlty check --filter trufflehog`, a separate subcommand —
      # `smells` never invokes plugins) are enabled (see .qlty/qlty.toml);
      # every other third-party linter plugin it could also run is
      # disabled, ruff/ty stay the only linter/type-checker (see
      # CLAUDE.md). Installed by mise above, pinned in mise.toml since
      # issue #190: an unpinned qlty's bundled plugin defaults changed under
      # us and failed every branch. Bump it deliberately (CLAUDE.md).
      - name: Check the qlty version
        run: qlty --version

      # Runs the committed .pre-commit-config.yaml as-is — every hook is
      # `language: system`, shelling out to `uv run ruff`/`uv run ty`/
      # `qlty`, so this is the exact same check as the local git hook,
      # not a second copy of it. See CLAUDE.md's Tooling section.
      #
      # Deliberately `uv run pre-commit` rather than the pre-commit/action
      # marketplace action: that action does its own `pip install
      # pre-commit` into whatever venv is active, but a `uv`-managed venv
      # has no pip in it by default — pre-commit is already a `uv` dev
      # dependency here (`uv sync` above installs it), so there's nothing
      # for a second installer to do.
      - name: Run pre-commit hooks
        run: uv run pre-commit run --all-files
