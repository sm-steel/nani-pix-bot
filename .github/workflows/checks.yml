name: Checks

on:
  push:
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**"]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Install project dependencies
        run: uv sync

      # Just the CLI binary — no Qlty Cloud account involved. Complexity/
      # duplication analysis (`qlty smells`) plus the trufflehog secret
      # scan (`qlty check --filter trufflehog`, a separate subcommand —
      # `smells` never invokes plugins) are enabled (see .qlty/qlty.toml);
      # every other third-party linter plugin it could also run is
      # disabled, ruff/ty stay the only linter/type-checker (see
      # CLAUDE.md).
      #
      # Version pinned (issue #190) via the install script's QLTY_VERSION —
      # qltysh/qlty-action/install has no version input and always pulls
      # the latest CLI, whose bundled plugin defaults can change under us
      # between runs (that's how an unpinned trufflehog started failing
      # every branch). Keep this in step with the qlty you run locally
      # (`qlty upgrade --version <same>`), and bump both deliberately.
      - name: Install qlty
        env:
          QLTY_VERSION: "0.650.0"
        run: |
          curl -fsSL https://qlty.sh | sh
          echo "$HOME/.qlty/bin" >> "$GITHUB_PATH"

      # Runs the committed .pre-commit-config.yaml as-is — every hook is
      # `language: system`, shelling out to `uv run ruff`/`uv run ty`/
      # `qlty`, so this is the exact same check as the local git hook,
      # not a second copy of it. See CLAUDE.md's Tooling section.
      #
      # Deliberately `uv run pre-commit` rather than the pre-commit/action
      # marketplace action: that action does its own `pip install
      # pre-commit` into whatever venv is active, but a `uv`-managed venv
      # has no pip in it by default — pre-commit is already a `uv` dev
      # dependency here (`uv sync` above installs it), so there's nothing
      # for a second installer to do.
      - name: Run pre-commit hooks
        run: uv run pre-commit run --all-files
