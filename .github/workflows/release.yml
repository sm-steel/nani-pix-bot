name: Release

# Fires after checks.yml/tests.yml would already have run on the same
# push (both trigger on push to master too) -- semantic-release itself
# doesn't gate on their success, so this assumes master is only ever
# updated through a merge that already passed CI, same assumption
# deploy.yml made before it.
on:
  push:
    branches: [master]
    paths-ignore: ["**.md", "docs/**"]

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Semantic Version Release
        id: release
        uses: python-semantic-release/python-semantic-release@9a026e9303981c866c3425723009becb2437c757 # v10.6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          git_committer_name: "github-actions"
          git_committer_email: "actions@users.noreply.github.com"
          build: false
          changelog: true
          # commit: false is deliberate, not a bug -- master requires PRs,
          # and GITHUB_TOKEN can't push a branch update around that. Tags
          # live in a different ref namespace (refs/tags/*, not
          # refs/heads/master) so push+tag alone never touches the
          # protected branch. pyproject.toml's version IS still stamped
          # on disk (see version_toml in pyproject.toml) even with
          # commit: false -- that change is just never committed/pushed.
          # Verified live (v1.0.0 run) that the stamped, uv.lock-drifted
          # version does NOT break the Dockerfile's `uv sync --frozen`:
          # this project's root package is `source = { editable = "." }`
          # in uv.lock, and uv builds an editable root package fresh from
          # the working tree rather than enforcing its locked version --
          # that strict check only applies to real, hash-pinned
          # dependencies. Don't assume this generalizes to a non-editable
          # install without re-checking.
          commit: false
          push: true
          tag: true
          vcs_release: true

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: steps.release.outputs.released == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        if: steps.release.outputs.released == 'true'
        with:
          context: .
          push: true
          tags: ghcr.io/sm-steel/nani-pix-bot:${{ steps.release.outputs.version }}
