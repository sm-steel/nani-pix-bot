name: Release

# Run by hand (Actions -> Release -> Run workflow on master) when the
# merged PRs should ship -- merging to master never releases by itself, so
# any number of PRs can accumulate into one version. semantic-release
# reads every Conventional Commit since the last tag to pick the bump.
# master only takes PRs whose checks.yml/tests.yml passed (the master
# ruleset requires both), so whatever it tags has already been through CI.
on:
  workflow_dispatch:

# Two releases at once would compute the same next version and race to
# push the same tag.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  release:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release.outputs.released }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Semantic Version Release
        id: release
        uses: python-semantic-release/python-semantic-release@b700dbeb1f431a0fcc30a79f3f0869407fe07278 # v10.7.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          git_committer_name: "github-actions"
          git_committer_email: "actions@users.noreply.github.com"
          build: false
          # The player-facing notes are hand-written (docs/release-notes.md),
          # and with commit: false a generated CHANGELOG.md would never be
          # committed anyway.
          changelog: false
          # commit: false is deliberate, not a bug -- master requires PRs,
          # and GITHUB_TOKEN can't push a branch update around that. Tags
          # live in a different ref namespace (refs/tags/*, not
          # refs/heads/master) so push+tag alone never touches the
          # protected branch. pyproject.toml's version IS still stamped
          # on disk (see version_toml in pyproject.toml) even with
          # commit: false -- that change is just never committed/pushed.
          # Verified live (v1.0.0 run) that the stamped, uv.lock-drifted
          # version does NOT break the Dockerfile's `uv sync --frozen`:
          # this project's root package is `source = { editable = "." }`
          # in uv.lock, and uv builds an editable root package fresh from
          # the working tree rather than enforcing its locked version --
          # that strict check only applies to real, hash-pinned
          # dependencies. Don't assume this generalizes to a non-editable
          # install without re-checking.
          commit: false
          push: true
          tag: true
          vcs_release: true

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: steps.release.outputs.released == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        if: steps.release.outputs.released == 'true'
        with:
          context: .
          push: true
          tags: ghcr.io/sm-steel/nani-pix-bot:${{ steps.release.outputs.version }}

  # The guide documents the released bot, so it's published with each
  # release rather than on every merge to master.
  docs:
    needs: release
    if: needs.release.outputs.released == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yml
