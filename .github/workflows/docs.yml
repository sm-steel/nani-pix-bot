name: Docs

# The user's guide (docs/site, Astro Starlight). Builds on every PR that
# can change it; deploys to GitHub Pages only from master — the site
# documents the released bot. tests.yml ignores docs/**, so the guide's
# own pytest checks run here.
on:
  push:
    paths: &docs_paths
      - "docs/site/**"
      - "scripts/gen_docs_stages.py"
      - "scripts/gen_docs_cards.py"
      - "src/nani_pix_bot/services/pixelate/**"
      - "src/nani_pix_bot/services/settings/stage_config.py"
      - "src/nani_pix_bot/services/cards/**"
      - "src/nani_pix_bot/services/achievements/**"
      - "src/nani_pix_bot/services/economy/config.py"
      - "src/nani_pix_bot/assets/**"
      - "src/nani_pix_bot/locales/**"
      - "src/nani_pix_bot/release_notes/**"
      - "src/nani_pix_bot/app.py"
      - "src/nani_pix_bot/commands/helpers/bot_menu.py"
      - "tests/docs/**"
      - "mise.toml"
      - "mise.lock"
      - ".github/workflows/docs.yml"
  pull_request:
    paths: *docs_paths
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          python-version: "3.11"

      - name: Install project dependencies
        run: uv sync

      # Node is pinned in mise.toml/mise.lock (locked mode).
      - name: Install pinned Node
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.10.4
          install_args: node

      - name: Guide tests (page parity, command table, stage generator)
        run: uv run pytest -q tests/docs tests/scripts/test_gen_docs_stages.py tests/scripts/test_gen_docs_cards.py

      - name: Install site dependencies
        working-directory: docs/site
        run: npm ci

      # prebuild regenerates the pixelation-stage images first.
      - name: Build site
        working-directory: docs/site
        run: npm run build

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/site/dist

  deploy:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
