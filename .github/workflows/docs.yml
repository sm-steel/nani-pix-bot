name: Docs

# The user's guide (docs/site, Astro Starlight). Builds on every push/PR
# that can change it; deploys to GitHub Pages only when release.yml calls
# it after cutting a release (or on a manual run on master) — the site
# documents the released bot, not whatever has merged since. The guide's
# own pytest checks run here, not in tests.yml.
on:
  push:
    paths: &docs_paths
      - "docs/site/**"
      - "scripts/gen_docs_stages.py"
      - "scripts/gen_docs_cards.py"
      - "src/nani_pix_bot/services/pixelate/**"
      - "src/nani_pix_bot/services/settings/stage_config.py"
      - "src/nani_pix_bot/services/cards/**"
      - "src/nani_pix_bot/services/achievements/**"
      - "src/nani_pix_bot/services/economy/config.py"
      - "src/nani_pix_bot/services/cosmetics/**"
      - "src/nani_pix_bot/services/reveal/**"
      - "src/nani_pix_bot/services/seasons/**"
      - "src/nani_pix_bot/seasons/**"
      - "src/nani_pix_bot/assets/**"
      - "src/nani_pix_bot/locales/**"
      - "src/nani_pix_bot/release_notes/**"
      - "src/nani_pix_bot/app.py"
      - "src/nani_pix_bot/commands/helpers/bot_menu.py"
      - "tests/docs/**"
      - "mise.toml"
      - "mise.lock"
      - ".github/workflows/docs.yml"
  pull_request:
    paths: *docs_paths
  workflow_dispatch:
  workflow_call:

# Keyed on the event too, so a push to master can't cancel the deploy a
# release (workflow_dispatch) has in flight.
concurrency:
  group: docs-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.11"

      - name: Install project dependencies
        run: uv sync

      # Node and ffmpeg are pinned in mise.toml/mise.lock (locked mode). ffmpeg renders
      # the Sakura page's cosmetic clips (gen_docs_cards.py) and their test.
      - name: Install pinned tools (Node, ffmpeg)
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          version: 2026.10.4

      - name: Guide tests (page parity, command table, stage generator)
        run: uv run pytest -q tests/docs tests/scripts/test_gen_docs_stages.py tests/scripts/test_gen_docs_cards.py

      - name: Install site dependencies
        working-directory: docs/site
        run: npm ci

      # prebuild regenerates the pixelation-stage images, the cards and the cosmetic
      # clips first (the clips need the ffmpeg installed above).
      - name: Build site
        working-directory: docs/site
        run: npm run build

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/site/dist

  deploy:
    # Called from release.yml, github.* is the caller's context, so this is
    # true both for a release and for a manual run of this workflow.
    if: github.ref == 'refs/heads/master' && github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
