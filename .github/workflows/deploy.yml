name: Deploy

# Only ever fires on a push straight to master — never on pull_request,
# so a fork PR can't reach this workflow's secrets. Re-runs checks.yml's
# and tests.yml's steps itself as a gate (not wired as a cross-workflow
# `needs:` — not supported across separate workflow files). Doc-only
# merges skip this too — no app code changed, nothing to redeploy.
on:
  push:
    branches: [master]
    paths-ignore: ["**.md", "docs/**"]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Install project dependencies
        run: uv sync

      - name: Install qlty
        uses: qltysh/qlty-action/install@v1

      - name: Run pre-commit hooks
        run: uv run pre-commit run --all-files

      - name: Run tests
        run: uv run pytest -q

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      # Needed to read secrets/app.sops.yaml below — this job otherwise
      # has no use for a local checkout, since `git pull` runs on moscow
      # itself over SSH.
      - uses: actions/checkout@v4

      # Loads MOSCOW_SSH_KEY into an ssh-agent for the ssh steps below.
      # This is a dedicated deploy-only key, not the personal key used
      # to administer moscow interactively — see CLAUDE.md.
      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.MOSCOW_SSH_KEY }}

      # Same version/checksum pin as priv-vps-infrastructure's own
      # workflows — bump by hand, checksum from the release's own
      # checksums file, not computed from whatever got downloaded.
      - name: Install sops
        env:
          SOPS_VERSION: v3.13.3
          SOPS_SHA256: e5bec3346a873ae91d871550f3e698c1aad962aff462a080e40f25fde17fef6b
        run: |
          curl -fsSL -o /tmp/sops "https://github.com/getsops/sops/releases/download/${SOPS_VERSION}/sops-${SOPS_VERSION}.linux.amd64"
          echo "${SOPS_SHA256}  /tmp/sops" | sha256sum -c -
          sudo install -m 0755 /tmp/sops /usr/local/bin/sops

      # priv-vps-infrastructure#73: .env lives only on moscow's disk today,
      # never in this repo or any store. Decrypts here (where
      # SOPS_AGE_KEY lives) and ships the plaintext straight to moscow
      # over the same SSH connection — never written to this runner's own
      # disk. Deploy runs compose on the host itself (next step), not in
      # this job, so a plain `sops -d > .env` here would leave a file
      # nothing ever reads.
      #
      # shell: bash, not left to the OS default — GitHub's unset-shell
      # default on Linux is `bash -e {0}` WITHOUT `-o pipefail`, so a
      # failed `sops decrypt` on the left of a pipe would be swallowed and
      # hand ssh empty stdin, which would then overwrite the live secret
      # with an empty file. Learned the hard way on ley-shards-bot's
      # equivalent step (missing checkout there caused exactly this,
      # confirmed live) — fixed here from the start instead of repeating
      # it. The `test -s` guard on the remote side is defense in depth
      # against the same class of bug from a different cause.
      #
      # umask 077 secures the file the instant it's created; writing to a
      # temp name and mv-ing into place keeps the live path from ever
      # holding a partial write if the connection hiccups mid-stream.
      - name: Render and ship .env to moscow
        shell: bash
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          MOSCOW_HOST: ${{ secrets.MOSCOW_HOST }}
          MOSCOW_USER: ${{ secrets.MOSCOW_USER }}
        run: |
          sops decrypt --extract '["env"]' secrets/app.sops.yaml | \
            ssh -o StrictHostKeyChecking=accept-new "$MOSCOW_USER@$MOSCOW_HOST" '
              set -e
              umask 077
              cat > /opt/nani-pix-bot/.env.new
              test -s /opt/nani-pix-bot/.env.new
              mv /opt/nani-pix-bot/.env.new /opt/nani-pix-bot/.env
            '

      # Migrate before the bot container starts, not after: app.py's
      # startup re-arms pending timeout jobs by querying the `games`
      # table, so if `bot` starts against a schema a pending migration
      # hasn't created yet, it crash-loops and `docker compose exec`
      # can't even reach it ("container is restarting"). Running the
      # migration via a throwaway `run --rm` container (mariadb already
      # up and healthy from the first `up -d`) avoids that ordering bug
      # entirely — found the hard way during nani-pix-bot's first deploy.
      - name: Deploy to moscow
        env:
          MOSCOW_HOST: ${{ secrets.MOSCOW_HOST }}
          MOSCOW_USER: ${{ secrets.MOSCOW_USER }}
        run: |
          ssh -o StrictHostKeyChecking=accept-new "$MOSCOW_USER@$MOSCOW_HOST" '
            set -e
            cd /opt/nani-pix-bot
            git pull --ff-only
            docker compose build
            docker compose up -d mariadb
            docker compose run --rm --no-deps bot uv run --no-dev alembic upgrade head
            docker compose up -d
          '
