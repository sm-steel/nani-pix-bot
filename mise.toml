# Machine tools pinned for local dev, CI and the Docker image (issue #295).
# mise.lock records each platform's download URL and sha256; locked mode
# makes `mise install` refuse anything the lockfile doesn't cover.
[settings]
locked = true

# ffmpeg/ffprobe: BtbN's static GPL build of ffmpeg 7.1.1 (libx264 built in).
[tools."github:BtbN/FFmpeg-Builds"]
version = "autobuild-2025-08-31-13-00"
bin_path = "bin"
strip_components = 1

[tools."github:BtbN/FFmpeg-Builds".platforms]
linux-x64 = { asset_pattern = "ffmpeg-n7.1.1-*-linux64-gpl-7.1.tar.xz" }
windows-x64 = { asset_pattern = "ffmpeg-n7.1.1-*-win64-gpl-7.1.zip" }
