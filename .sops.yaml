---
# Which age recipient encrypts what. `sops <file>` consults this on CREATE,
# so a new secret file is encrypted to the right key without anyone passing
# `--age` by hand.
#
# One rule, matching on the `.sops.yaml` / `.sops.yml` suffix alone. It is
# deliberately not scoped to `secrets/`: sops matches `path_regex` against
# the path as the OS spells it, so a rule containing `/` silently fails to
# match on a Windows workstation (found the hard way in
# priv-vps-infrastructure — `error loading config: no matching creation
# rules found`), and a rule that has to carry a `[\/]` class to work
# everywhere is a footgun for the next person who edits it. The suffix is
# what actually identifies a secret file here — consumed by `sops decrypt`
# in deploy.yml, not by any Ansible-style vars plugin.
#
# ONE recipient, fleet-wide, shared with priv-vps-infrastructure and every
# other repo using this pattern — same public key, same `SOPS_AGE_KEY`
# secret name. See priv-vps-infrastructure's docs/secrets-store.md for the
# custody arrangement (GitHub secret + vault) and why a second recipient
# was considered and deferred.
#
# Rotating this key is NOT just editing the line below: every existing file
# in every repo using it has to be re-encrypted with `sops updatekeys`.
# Procedure in priv-vps-infrastructure's docs/secrets-store.md.

creation_rules:
  - path_regex: \.sops\.ya?ml$
    age: age1t4pfq5t9qwlwmpkjcs0l9randrh83n3grfnahu9fxedwfjs0wsqs6mxlcf
